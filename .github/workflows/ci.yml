# CI pipeline — TESTING §12 stages 1-8 (stage 9 gates with the phases that
# own them). Stage 6 integration runs the apps/api Testcontainers suites in
# their own step inside the quality job (Docker is preinstalled on hosted
# runners). Windows dev host / Linux CI: POSIX paths only.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per ref; superseded pushes cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: "install -> lint -> line-count -> typecheck -> unit -> integration -> build"
    # Pinned, not ubuntu-latest: the label flips OS versions silently
    # (Ubuntu 26 migration 2026-10-19); upgrade deliberately instead.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Stage 1 — install. pnpm version comes from packageManager (pnpm@10.15.1).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # bun:test runs the unit specs of packages/* + apps/api (TESTING §2.1);
      # pinned to the host dev version to keep runtimes identical.
      # 1.4.3 (2026-10-18): Testcontainers on Windows dev hosts needs named-pipe
      # http + dockerode streaming, both broken in 1.2.21.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Turbo local cache (hit-once per commit, prefix-restored across PRs).
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stages 2-4, in order — each step fails fast before the next starts.
      - name: lint
        run: pnpm turbo run lint

      - name: line-count
        run: pnpm turbo run line-count

      - name: typecheck
        run: pnpm turbo run typecheck

      # Stage 5 — unit: bun:test (packages + api services, Docker-free) and
      # Vitest (web) in parallel.
      - name: unit tests
        run: pnpm turbo run test

      # Stage 6 — integration: apps/api Testcontainers Postgres suites
      # (one container per suite file; see TESTING §7).
      - name: integration tests
        run: pnpm turbo run test:integration

      # Stage 7 — build: web (RRv7 SPA via vite) + api (bun build).
      - name: build
        run: pnpm turbo run build

  e2e:
    name: "e2e: Playwright chromium"
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Browser binaries keyed on the lockfile (it pins @playwright/test).
      - name: Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install chromium + system deps
        run: pnpm --filter @sharq/web exec playwright install --with-deps chromium

      # Stage 8 (skeleton scope): hello spec only until the Vite webServer lands.
      - name: Run E2E
        run: pnpm e2e

      # TESTING §9: snapshot goldens are COMMITTED, never generated on the
      # fly. A missing baseline makes Playwright write it in-run (attempt 1
      # fails, the retry then passes "flaky-green") — this check turns any
      # written/updated golden into a red job, and the artifact upload below
      # ships the fresh goldens back so they can be committed.
      - name: Fail on uncommitted snapshot goldens
        if: success() || failure()
        run: |
          changed=$(git status --porcelain -- apps/web/e2e)
          if [ -n "$changed" ]; then
            echo "::error::Playwright wrote snapshot goldens that are not committed:"
            echo "$changed"
            echo "Download the playwright-artifacts, commit the goldens, push."
            exit 1
          fi

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results
            apps/web/playwright-report
            apps/web/e2e/*-snapshots
          if-no-files-found: ignore
