packages:
  - "apps/*"
  - "packages/*"

# Single version source for shared dependencies (SPEC §8.4).
# Packages reference these as "catalog:" — never pin a shared version twice.
catalog:
  eslint: "10.13.0"
  "@axe-core/playwright": "4.14.0"
  "@playwright/test": "1.64.1"
  "@sinclair/typebox": "0.34.52"
  "@tanstack/react-query": "5.104.4"
  "@tanstack/react-table": "9.3.1"
  "@tanstack/react-virtual": "3.14.21"
  "@testing-library/dom": "10.4.2"
  "@testing-library/jest-dom": "7.0.1"
  "@testing-library/react": "16.3.3"
  "@types/bun": "1.2.23"
  "@types/node": "24.19.2"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  playwright-core: "1.64.1"
  date-fns: "4.4.0"
  i18next: "26.5.2"
  jsdom: "30.1.3"
  react: "19.3.1"
  react-dom: "19.3.1"
  react-i18next: "17.1.0"
  tailwindcss: "4.3.3"
  typescript: "6.0.3"
  vite: "7.3.7"
  vitest: "5.0.5"

# Dependencies allowed to run install scripts (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - unrs-resolver
