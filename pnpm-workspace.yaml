packages:
  - "apps/*"
  - "packages/*"

# Single version source for shared dependencies (SPEC §8.4).
# Packages reference these as "catalog:" — never pin a shared version twice.
catalog:
  eslint: "10.13.0"
  "@axe-core/playwright": "4.14.0"
  "@testcontainers/postgresql": "12.2.1"
  "@base-ui/react": "1.9.0"
  "@playwright/test": "1.64.1"
  "@react-router/dev": "7.18.4"
  "@react-router/fs-routes": "7.18.4"
  "@react-router/node": "7.18.4"
  "@sinclair/typebox": "0.34.52"
  "@tailwindcss/vite": "4.3.3"
  "@tanstack/react-query": "5.104.4"
  "@tanstack/react-table": "9.3.1"
  "@tanstack/react-virtual": "3.14.21"
  "@testing-library/dom": "10.4.2"
  "@testing-library/jest-dom": "7.0.1"
  "@testing-library/react": "16.3.3"
  "@types/bun": "1.4.3"
  "@types/node": "24.19.2"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  drizzle-kit: "0.31.11"
  drizzle-orm: "0.45.4"
  class-variance-authority: "0.7.1"
  cn: "0.5.0"
  playwright-core: "1.64.1"
  react-router: "7.18.4"
  date-fns: "4.4.0"
  isbot: "5.2.2"
  i18next: "26.5.2"
  jsdom: "30.1.3"
  postgres: "3.4.9"
  react: "19.3.1"
  react-dom: "19.3.1"
  react-i18next: "17.1.0"
  tailwindcss: "4.3.3"
  tw-animate-css: "1.4.0"
  typescript: "6.0.3"
  vite: "7.3.7"
  vitest: "5.0.5"

# Dependencies allowed to run install scripts (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - unrs-resolver
